# Local PostgreSQL for the offshore-fleet-mlops project — run with:
#   docker compose -f docker/docker-compose.yml up -d
# Gives a real Postgres server with the `maridive` database already created.
# Data persists in the named volume across restarts.
#
# `name` sets an explicit Compose project so this stack is ISOLATED. Without it,
# Compose names the project after the parent folder ("docker"), which collides with
# any other project whose compose file also lives in a folder named "docker".
name: offshore-fleet-mlops
services:
  postgres:
    image: postgres:16
    container_name: maridive_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: maridive_dev_pw   # local dev only — matches .env
      POSTGRES_DB: maridive                # database is auto-created on first start
    ports:
      - "5432:5432"                        # host:container
    volumes:
      - maridive_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  maridive_pgdata:
