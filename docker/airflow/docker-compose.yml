# Airflow (LocalExecutor) that orchestrates the fleet pipeline.
#   docker compose -f docker/airflow/docker-compose.yml up -d --build
# UI: http://localhost:8080  (login admin / admin — local dev only)
#
# Design notes:
#  - Own Postgres for Airflow metadata (SQLite locks under a scheduler).
#  - LocalExecutor => the scheduler runs tasks itself (no Celery/Redis).
#  - Tasks reach the project's data DB (maridive_pg) via host.docker.internal.
name: offshore-fleet-airflow

x-airflow-common: &airflow-common
  build: .
  env_file:
    - ../../.env                     # POSTGRES_USER/PASSWORD/DB/PORT for our data DB
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: '371ATuBcde-xoTkWh2E7oMEkpl3XCEmHKKqKOMVpQbg='  # local dev only
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    PYTHONPATH: /opt/airflow/project
    POSTGRES_HOST: host.docker.internal   # overrides .env's localhost -> reach maridive_pg on host
    MLFLOW_ENABLED: '0'                   # skip mlflow inside Airflow (dependency conflict)
  volumes:
    - ../..:/opt/airflow/project          # mount the whole project (src, dags, config, .env, data)
    - airflow-logs:/opt/airflow/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  user: "50000:0"

services:
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname admin --lastname admin --role Admin --email admin@example.com || true
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
  airflow-logs:
